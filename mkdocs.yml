site_name: CoNG Handbook
site_description: Hardware and basic software setup manuals for VLA Pipeline, Self Improvement Learning, ABC Box, and TurtleBot3 Burger
site_url: https://cong-harvard.github.io/handbook/
repo_url: https://github.com/CoNG-harvard/handbook
repo_name: CoNG-harvard/handbook
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.sections     # show every handbook section in the sidebar
    - navigation.expand       # keep page links visible across projects
    - navigation.top            # back-to-top button
    - navigation.tracking       # URL tracks the scrolled section
    - navigation.footer         # prev/next links at the bottom of each page
    - toc.follow
    - content.code.copy         # copy button on code blocks
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white            # minimal header like GitBook
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/handbook.css?v=11

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - All projects: index.md
  - Shared setup:
      - Before you begin: getting-started/index.md
      - Safety: getting-started/safety.md
      - Shared computer and hardware: getting-started/hardware.md
      - Prepare the workstation: getting-started/computer.md
      - Basic software: getting-started/software.md
      - Glossary: getting-started/glossary.md
      - Hardware troubleshooting: getting-started/troubleshooting.md
      - Equipment references: getting-started/sources.md
  - VLA Pipeline:
      - Overview: vla-pipeline/index.md
      - "1. Equipment and connections": vla-pipeline/hardware/index.md
      - "2. Basic software": vla-pipeline/software.md
      - "3. Hardware readiness": vla-pipeline/readiness.md
  - Self Improvement Learning:
      - Overview: unidog-nav/index.md
      - "1. Equipment and connections": unidog-nav/hardware.md
      - "2. Mount and check the D1 arm": unidog-nav/d1-arm.md
      - "3. Basic software": unidog-nav/software.md
      - "4. Hardware readiness": unidog-nav/readiness.md
  - ABC Box:
      - Overview: abc-box/index.md
      - "1. Equipment and connections": abc-box/hardware.md
      - "2. Basic software": abc-box/software.md
      - "3. Hardware readiness": abc-box/readiness.md
  - TurtleBot3 Burger:
      - Overview: turtlebot3/index.md
      - "1. Equipment and connections": turtlebot3/hardware.md
      - "2. Basic software": turtlebot3/software.md
      - "3. Hardware readiness": turtlebot3/readiness.md
