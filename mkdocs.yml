site_name: CoNG Handbook
site_description: Lab projects and setup guides for VLA Pipeline and Self Improvement Learning
site_url: https://cong-harvard.github.io/handbook/
repo_url: https://github.com/CoNG-harvard/handbook
repo_name: CoNG-harvard/handbook
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top            # back-to-top button
    - navigation.tracking       # URL tracks the scrolled section
    - navigation.footer         # prev/next links at the bottom of each page
    - toc.follow
    - content.code.copy         # copy button on code blocks
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white            # minimal header like GitBook
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/handbook.css

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Projects: index.md
  - Shared setup:
      - getting-started/index.md
      - Shared computer and hardware: getting-started/hardware.md
      - Prepare a new computer: getting-started/computer.md
      - Source files and handoff: getting-started/sources.md
  - VLA Pipeline:
      - vla-pipeline/index.md
      - "1. Hardware and connections": vla-pipeline/hardware/index.md
      - "2. Install the software": vla-pipeline/install.md
      - "3. Configure and start": vla-pipeline/teleop/setup.md
      - "4. Record a demonstration": vla-pipeline/teleop/operation.md
      - "5. Run a trained model": vla-pipeline/inference/index.md
      - Reference:
          - Teleoperation overview: vla-pipeline/teleop/index.md
          - Prepare recordings: vla-pipeline/teleop/datasets.md
          - Model handoff and training: vla-pipeline/training/index.md
  - Self Improvement Learning:
      - unidog-nav/index.md
      - "1. Hardware and connections": unidog-nav/hardware.md
      - "2. Install the software": unidog-nav/setup.md
      - "3. Connect the robot": unidog-nav/robot-bridge.md
      - "4. First supervised movement": unidog-nav/first-run.md
      - Quick reference: unidog-nav/quick-reference.md
      - Advanced reference:
          - Offline model evaluation: unidog-nav/vla-eval.md
          - Voice and benchmarks: unidog-nav/operator-cookbook.md
          - Legacy closed-loop rollout: unidog-nav/rollout.md
          - Historical findings: unidog-nav/roadmap.md
