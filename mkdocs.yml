site_name: CoNG Handbook
site_description: Hardware platform setup manuals for VLA Pipeline, Self Improvement Learning, and ABC Box
site_url: https://cong-harvard.github.io/handbook/
repo_url: https://github.com/CoNG-harvard/handbook
repo_name: CoNG-harvard/handbook
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top            # back-to-top button
    - navigation.tracking       # URL tracks the scrolled section
    - navigation.footer         # prev/next links at the bottom of each page
    - toc.follow
    - content.code.copy         # copy button on code blocks
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white            # minimal header like GitBook
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/handbook.css?v=6

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - All projects: index.md
  - Shared setup:
      - Before you begin: getting-started/index.md
      - Shared computer and hardware: getting-started/hardware.md
      - Prepare the workstation: getting-started/computer.md
      - Equipment references: getting-started/sources.md
      - Lab resources: getting-started/lab-resources.md
  - VLA Pipeline:
      - Overview: vla-pipeline/index.md
      - "1. Equipment and connections": vla-pipeline/hardware/index.md
      - "2. Hardware readiness": vla-pipeline/readiness.md
  - Self Improvement Learning:
      - Overview: unidog-nav/index.md
      - "1. Equipment and connections": unidog-nav/hardware.md
      - "2. D1 arm readiness": unidog-nav/d1-arm.md
      - "3. Hardware readiness": unidog-nav/readiness.md
  - ABC Box:
      - Overview: abc-box/index.md
      - "1. Equipment and connections": abc-box/hardware.md
      - "2. Hardware readiness": abc-box/readiness.md
