<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">CoNG VLA hardware architecture</title>
  <desc id="desc">Diagram showing two xArm rigs, two Quest headsets, three RealSense cameras, and the workstation connections.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#27364a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2166a5"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2b7a4b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b2733" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f7f9fc; }
      .band { fill: #eaf0f7; }
      .card { fill: #ffffff; stroke: #d1d9e6; stroke-width: 2; filter: url(#shadow); }
      .workstation { fill: #f8fbff; stroke: #2166a5; stroke-width: 3; filter: url(#shadow); }
      .robot { fill: #fff8f1; stroke: #b85c00; stroke-width: 3; filter: url(#shadow); }
      .camera { fill: #f3fbf6; stroke: #2b7a4b; stroke-width: 3; filter: url(#shadow); }
      .quest { fill: #fbf7ff; stroke: #7a4ab8; stroke-width: 3; filter: url(#shadow); }
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #182536; }
      .h { font: 700 20px Inter, Arial, sans-serif; fill: #182536; }
      .small { font: 500 15px Inter, Arial, sans-serif; fill: #46566a; }
      .tiny { font: 500 13px Inter, Arial, sans-serif; fill: #637086; }
      .label { font: 700 13px Inter, Arial, sans-serif; fill: #27364a; }
      .usb { stroke: #2166a5; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .lan { stroke: #27364a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .video { stroke: #2b7a4b; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 10 8; }
      .chip { fill: #eef4fb; stroke: #cbd7e5; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect class="band" x="0" y="96" width="1280" height="560"/>

  <text class="title" x="64" y="56">CoNG VLA Data Collection Hardware</text>
  <text class="small" x="64" y="83">USB carries headset and camera data. Ethernet carries xArm control traffic. The workstation hosts teleop, recording, training, and inference.</text>

  <rect class="quest" x="70" y="145" rx="18" ry="18" width="245" height="150"/>
  <text class="h" x="96" y="184">Rig A Quest 3</text>
  <text class="small" x="96" y="216">Serial &lt;QUEST_A_SERIAL&gt;</text>
  <text class="tiny" x="96" y="242">Browser: localhost:8012</text>
  <text class="tiny" x="96" y="266">ADB reverse to host :8012</text>

  <rect class="quest" x="70" y="465" rx="18" ry="18" width="245" height="150"/>
  <text class="h" x="96" y="504">Rig B Quest 3</text>
  <text class="small" x="96" y="536">Serial &lt;QUEST_B_SERIAL&gt;</text>
  <text class="tiny" x="96" y="562">Browser: localhost:8012</text>
  <text class="tiny" x="96" y="586">ADB reverse to host :8013</text>

  <rect class="workstation" x="430" y="160" rx="22" ry="22" width="420" height="440"/>
  <text class="h" x="462" y="202">Linux workstation</text>
  <text class="small" x="462" y="232">&lt;WORKSTATION_IP&gt;</text>
  <rect class="chip" x="462" y="258" rx="10" ry="10" width="350" height="48"/>
  <text class="small" x="482" y="288">Teleop web servers: :8012, :8013</text>
  <rect class="chip" x="462" y="320" rx="10" ry="10" width="350" height="48"/>
  <text class="small" x="482" y="350">teleimager-server: :60000 config</text>
  <rect class="chip" x="462" y="382" rx="10" ry="10" width="350" height="48"/>
  <text class="small" x="482" y="412">lerobot-record + imageclient cameras</text>
  <rect class="chip" x="462" y="444" rx="10" ry="10" width="350" height="48"/>
  <text class="small" x="482" y="474">Training/inference GPU</text>
  <text class="tiny" x="482" y="523">RTX PRO 6000 Blackwell 96 GB</text>
  <text class="tiny" x="482" y="548">Workstation Edition</text>
  <text class="tiny" x="482" y="573">Ryzen 9 7950X, 94 GiB RAM</text>

  <rect class="camera" x="965" y="112" rx="16" ry="16" width="240" height="112"/>
  <text class="h" x="990" y="150">Rig A wrist</text>
  <text class="small" x="990" y="181">RealSense D405</text>
  <text class="tiny" x="990" y="203">&lt;WRIST_CAM_A_SERIAL&gt;</text>

  <rect class="camera" x="965" y="248" rx="16" ry="16" width="240" height="112"/>
  <text class="h" x="990" y="286">Rig A scene</text>
  <text class="small" x="990" y="317">RealSense D415</text>
  <text class="tiny" x="990" y="339">&lt;SCENE_CAM_A_SERIAL&gt;</text>

  <rect class="camera" x="965" y="384" rx="16" ry="16" width="240" height="112"/>
  <text class="h" x="990" y="422">Rig B wrist</text>
  <text class="small" x="990" y="453">RealSense D405</text>
  <text class="tiny" x="990" y="475">&lt;WRIST_CAM_B_SERIAL&gt;</text>

  <rect class="robot" x="940" y="555" rx="18" ry="18" width="275" height="130"/>
  <text class="h" x="970" y="594">xArm 7 robots</text>
  <text class="small" x="970" y="626">Rig A: &lt;ARM_A_IP&gt;</text>
  <text class="small" x="970" y="652">Rig B: &lt;ARM_B_IP&gt;</text>
  <text class="tiny" x="970" y="675">UMI soft grippers</text>

  <path class="usb" d="M315 220 C365 220 380 234 430 272"/>
  <text class="label" x="326" y="201">USB + adb reverse</text>
  <path class="usb" d="M315 540 C365 540 380 524 430 488"/>
  <text class="label" x="324" y="574">USB + adb reverse</text>

  <path class="video" d="M965 168 C910 168 890 200 850 280"/>
  <path class="video" d="M965 304 C910 304 890 320 850 342"/>
  <path class="video" d="M965 440 C910 440 890 424 850 404"/>
  <text class="label" x="884" y="104">USB 3.x camera feeds</text>

  <path class="lan" d="M850 520 C900 565 910 612 940 620"/>
  <text class="label" x="835" y="646">Ethernet LAN</text>

  <rect class="card" x="64" y="668" rx="14" ry="14" width="720" height="48"/>
  <text class="tiny" x="88" y="697">Data path: Quest controller poses -> xr_teleoperator -> xArm. Camera frames -> teleimager-server -> headset display and LeRobot dataset.</text>
</svg>
